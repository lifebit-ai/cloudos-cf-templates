AWSTemplateFormatVersion: 2010-09-09
Description: CloudFormation template to create IAM roles required to run Trusted App Hub in a client procurement account

Parameters:
  LifebitTrustedEntityArn:
    Type: List<String>
    Description: ARN of the Lifebit account root trusted to assume the hub role
    Default: arn:aws:iam::209235234270:root
  TrustedAppRoleName:
    Type: String
    Description: Name of the Trusted App Hub provisioning role
    Default: lifebit-trusted-app-hub-role
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Lifebit Platform Configurations
        Parameters:
          - LifebitTrustedEntityArn
      - Label:
          default: Role Names
        Parameters:
          - TrustedAppRoleName
    ParameterLabels:
      LifebitTrustedEntityArn:
        default: Trusted Entity ARN
      TrustedAppRoleName:
        default: Hub Role Name

Resources:
  TrustedAppHubRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref TrustedAppRoleName
      Description: Role to provision Trusted App Hub infrastructure (ECS, ALB, ACM, VPC, TGW).
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref LifebitTrustedEntityArn
            Action:
              - sts:AssumeRole
              - sts:TagSession

  TrustedAppHubTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: lifebit-trusted-app-hub-task-execution-role
      Description: Assumed by the ECS agent to pull Trusted App Hub container images from ECR and write logs to CloudWatch. Not assumed by the container application.
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  EcsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${TrustedAppRoleName}-ecs-policy"
      Description: ECS cluster, service, and task-definition management for Trusted App Hub
      Roles:
        - !Ref TrustedAppHubRole
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: EcsManagement
            Effect: Allow
            Action:
              - ecs:CreateCluster
              - ecs:DeleteCluster
              - ecs:CreateService
              - ecs:UpdateService
              - ecs:DeleteService
              - ecs:RegisterTaskDefinition
              - ecs:DeregisterTaskDefinition
              - ecs:DescribeClusters
              - ecs:DescribeServices
              - ecs:DescribeTaskDefinition
              - ecs:TagResource
              - ecs:UntagResource
              - ecs:ListTagsForResource
            Resource: "*"

  ElbPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${TrustedAppRoleName}-elb-policy"
      Description: Application Load Balancer, target group, listener, and rule management for Trusted App Hub
      Roles:
        - !Ref TrustedAppHubRole
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: ElbManagement
            Effect: Allow
            Action:
              - elasticloadbalancing:CreateLoadBalancer
              - elasticloadbalancing:DeleteLoadBalancer
              - elasticloadbalancing:CreateTargetGroup
              - elasticloadbalancing:DeleteTargetGroup
              - elasticloadbalancing:CreateListener
              - elasticloadbalancing:DeleteListener
              - elasticloadbalancing:CreateRule
              - elasticloadbalancing:DeleteRule
              - elasticloadbalancing:ModifyListener
              - elasticloadbalancing:ModifyRule
              - elasticloadbalancing:ModifyLoadBalancerAttributes
              - elasticloadbalancing:ModifyTargetGroupAttributes
              - elasticloadbalancing:RegisterTargets
              - elasticloadbalancing:DeregisterTargets
              - elasticloadbalancing:AddTags
              - elasticloadbalancing:RemoveTags
              - elasticloadbalancing:DescribeLoadBalancers
              - elasticloadbalancing:DescribeLoadBalancerAttributes
              - elasticloadbalancing:DescribeListeners
              - elasticloadbalancing:DescribeListenerAttributes
              - elasticloadbalancing:DescribeTags
              - elasticloadbalancing:DescribeTargetGroups
              - elasticloadbalancing:DescribeTargetGroupAttributes
              - elasticloadbalancing:DescribeTargetHealth
              - elasticloadbalancing:DescribeRules
            Resource: "*"

  Ec2NetworkingPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${TrustedAppRoleName}-ec2-networking-policy"
      Description: VPC, subnet, security group, route table, IGW, NAT, and TGW management for Trusted App Hub (TGW actions apply to FortigateFirewall procurements only)
      Roles:
        - !Ref TrustedAppHubRole
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: Ec2NetworkingManagement
            Effect: Allow
            Action:
              - ec2:CreateVpc
              - ec2:DeleteVpc
              - ec2:ModifyVpcAttribute
              - ec2:CreateSubnet
              - ec2:DeleteSubnet
              - ec2:ModifySubnetAttribute
              - ec2:CreateInternetGateway
              - ec2:DeleteInternetGateway
              - ec2:AttachInternetGateway
              - ec2:DetachInternetGateway
              - ec2:CreateNatGateway
              - ec2:DeleteNatGateway
              - ec2:AllocateAddress
              - ec2:ReleaseAddress
              - ec2:AssociateAddress
              - ec2:DisassociateAddress
              - ec2:CreateRouteTable
              - ec2:DeleteRouteTable
              - ec2:CreateRoute
              - ec2:DeleteRoute
              - ec2:AssociateRouteTable
              - ec2:DisassociateRouteTable
              - ec2:CreateSecurityGroup
              - ec2:DeleteSecurityGroup
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:RevokeSecurityGroupIngress
              - ec2:AuthorizeSecurityGroupEgress
              - ec2:RevokeSecurityGroupEgress
              - ec2:CreateVpcEndpoint
              - ec2:DeleteVpcEndpoints
              - ec2:ModifyVpcEndpoint
              - ec2:CreateTags
              - ec2:DeleteTags
              - ec2:DescribeVpcs
              - ec2:DescribeVpcAttribute
              - ec2:DescribeSubnets
              - ec2:DescribeInternetGateways
              - ec2:DescribeAddresses
              - ec2:DescribeAddressesAttribute
              - ec2:DescribeNatGateways
              - ec2:DescribeRouteTables
              - ec2:DescribeSecurityGroups
              - ec2:DescribeSecurityGroupRules
              - ec2:DescribeVpcEndpoints
              - ec2:DescribeAvailabilityZones
              - ec2:DescribeNetworkInterfaces
              - ec2:DescribeNetworkAcls
              - ec2:DescribePrefixLists
            Resource: "*"
          - Sid: TransitGatewayManagement
            Effect: Allow
            Action:
              - ec2:CreateTransitGatewayVpcAttachment
              - ec2:DeleteTransitGatewayVpcAttachment
              - ec2:ModifyTransitGatewayVpcAttachment
              - ec2:DescribeTransitGatewayVpcAttachments
              - ec2:CreateTransitGatewayRouteTable
              - ec2:DeleteTransitGatewayRouteTable
              - ec2:DescribeTransitGatewayRouteTables
              - ec2:AssociateTransitGatewayRouteTable
              - ec2:DisassociateTransitGatewayRouteTable
              - ec2:CreateTransitGatewayRoute
              - ec2:DeleteTransitGatewayRoute
              - ec2:SearchTransitGatewayRoutes
              - ec2:EnableTransitGatewayRouteTablePropagation
              - ec2:DisableTransitGatewayRouteTablePropagation
              - ec2:GetTransitGatewayRouteTablePropagations
              - ec2:GetTransitGatewayRouteTableAssociations
              - ec2:DescribeTransitGatewayAttachments
              - ec2:DescribeTransitGateways
              - ec2:DescribeTags
            Resource: "*"

  AcmPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${TrustedAppRoleName}-acm-policy"
      Description: ACM certificate request and lifecycle management for per-procurement wildcard TLS certificates
      Roles:
        - !Ref TrustedAppHubRole
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: AcmManagement
            Effect: Allow
            Action:
              - acm:RequestCertificate
              - acm:DeleteCertificate
              - acm:DescribeCertificate
              - acm:ListCertificates
              - acm:AddTagsToCertificate
              - acm:RemoveTagsFromCertificate
              - acm:ListTagsForCertificate
            Resource: "*"

  CloudWatchLogsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${TrustedAppRoleName}-cloudwatch-logs-policy"
      Description: CloudWatch log group management scoped to the Trusted App Hub ECS log group prefix
      Roles:
        - !Ref TrustedAppHubRole
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: CloudWatchLogsManagement
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:DeleteLogGroup
              - logs:PutRetentionPolicy
              - logs:TagResource
              - logs:UntagResource
              - logs:ListTagsForResource
            Resource:
              - !Sub "arn:aws:logs:*:${AWS::AccountId}:log-group:/ecs/trusted-app-*"
              - !Sub "arn:aws:logs:*:${AWS::AccountId}:log-group:/ecs/trusted-app-*:*"
          - Sid: CloudWatchLogsDescribe
            Effect: Allow
            Action:
              - logs:DescribeLogGroups
            Resource: "*"

  IamPassRolePolicy:
    Type: AWS::IAM::RolePolicy
    Properties:
      PolicyName: iam-pass-role-policy
      RoleName: !Ref TrustedAppHubRole
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: IamPassRole
            Effect: Allow
            Action:
              - iam:PassRole
              - iam:GetRole
            Resource:
              - !Sub "arn:aws:iam::${AWS::AccountId}:role/lifebit-trusted-app-hub-task-execution-role"

Outputs:
  HubRoleArn:
    Description: ARN of the Trusted App Hub provisioning role
    Value: !GetAtt [TrustedAppHubRole, Arn]
  TaskExecutionRoleArn:
    Description: ARN of the ECS task execution role
    Value: !GetAtt [TrustedAppHubTaskExecutionRole, Arn]
